titel: Valorisierung der Familienleistungen wieder in Kraft
stand: Forderung
quelle: Budgetdienst des Parlaments, Untergliederungsanalyse UG 25, Budgets 2027 und 2028
quelle_url: https://www.parlament.gv.at/fachinfos/budgetdienst/budget
wirkung_mio_jahr: 416
position: GF10
hinweis: >
  Die ausgesetzte Valorisierung bringt dem Bund 2026 bis 2028 zusammen 829 Mio.
  Die Wiederaufnahme kostet ab 2028 jaehrlich 416 Mio in der UG 25.
